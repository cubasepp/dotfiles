# kitty open-actions.conf
# Rules deciding how clicked links (OSC 8 hyperlinks / detected URLs) are opened.
# First matching rule wins; falls back to `open_url_with` in kitty.conf.
# Docs: https://sw.kovidgoyal.net/kitty/open_actions/

# --- Images: preview inline in an overlay window ---
protocol file
mime image/*
action launch --type=overlay --hold kitty +kitten icat ${FILE_PATH}

# --- Text files: open in your editor (catches anything kitty calls text/*) ---
protocol file
mime text/*
action launch --type=overlay ${EDITOR} ${FILE_PATH}

# --- Code/config formats kitty tags as application/* (json, yaml, toml, lock…) ---
protocol file
ext py,rb,js,mjs,cjs,ts,tsx,jsx,go,rs,c,h,cc,cpp,cxx,hpp,hh,java,kt,kts,swift,php,pl,pm,ex,exs,erl,hs,clj,cljs,scala,dart,jl,r,lua,vim,sh,bash,zsh,fish,ps1,erb,rake,gemspec,ru,rbi,slim,haml,html,htm,css,scss,sass,less,vue,svelte,xml,json,jsonc,yaml,yml,toml,ini,cfg,conf,env,properties,lock,sql,graphql,gql,proto,csv,tsv,md,markdown,rst,adoc,org,tex,txt,log,diff,patch,tf,tfvars,mk,cmake,dockerfile,gitignore,editorconfig
action launch --type=overlay ${EDITOR} ${FILE_PATH}

# --- Directories: open a new kitty window there ---
protocol file
mime inode/directory
action launch --type=os-window --cwd ${FILE_PATH}

# --- Web links: hand off to the macOS default browser ---
protocol http
protocol https
action launch --type=background open ${URL}

# --- mailto: links: default mail client ---
protocol mailto
action launch --type=background open ${URL}
