# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'catppuccin/tmux'

# Rebind keys
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Fix end/begin jump
set -g default-terminal "xterm-256color"
set-option -ga terminal-overrides ",xterm-256color:Tc"
# Pass OSC 8 hyperlinks through to the outer terminal (e.g. kitty)
set -as terminal-features ",xterm-256color:hyperlinks"
bind-key -n Home send Escape "OH"
bind-key -n End send Escape "OF"

# Bigger history
set -g history-limit 10000

# Status options
set-option -g status-position top

# New windows/pane in $PWD
bind c new-window -c "#{pane_current_path}"

# Pane navigation (vim-style): prefix + h/j/k/l, -r = repeatable
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# Mouse: click to select panes/windows, drag borders to resize, scroll
set -g mouse on

# 3-pane dev layout (main left + 2 stacked right): prefix + D
bind D source-file $HOME/.tmux/layouts/dev

# Resize panes (repeatable): prefix then H/J/K/L (capitals; avoids macOS ctrl+arrow)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
source-file $HOME/.tmux/config/ssh.common
source-file $HOME/.tmux/config/catppuccin.common
run '$HOME/.tmux/plugins/tpm/tpm'
